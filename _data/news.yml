- date: 23 May, 2026
  headline: "My former PhD student Andrew Mashintonio has been promoted to Associate Professor with Tenure at Kutztown University! Congratulations to Andrew. Has continued to study animal distribution and movement patterns, and recently published a paper in collaboration with another former student, Tanya Lubansky, on [changing humpback whale distributions in the Gulf of Maine](https://doi.org/10.1111/mms.70134), which was the topic of Tanya's PhD dissertation. Nice to see the academic family working together!"

- date: 19 May, 2025
  headline: "Lilith Janevska, a Biology and Math double major and member of the Urban Ecology Lab, will be working this summer on her project to develop an inexpensive device for detectig and recording bird window strikes."

- date: 3 May, 2025
  headline: "ESA <i>finally</i> confirmed acceptance of my presentation: Baltimore here we come!"

- date: 12 April, 2025
  headline: "Grant Bowers won this year's \"Outstanding Graduate Student\" award from the Jordan Hu College of Science and Liberal Arts."

- date: 16 March, 2025
  headline: "Grant Bowers just won a best student presentation award: \"<i>The Eugene P. Odum Award is sponsored by the Southeastern Chapter of the Ecological Society of America. This award is given annually for the best student oral presentation  on ecological research at the annual meeting of the Association of Southeastern Biologists</i>.\""

- date: 15 March, 2025
  headline: "The Bee Morphology group of UEL students who presented a poster at the Eastern Branch of the Entomological Society of America meeting yesterday won first place in the Undergrad Poster Division!"
  
- date: 28 December, 2024
  headline: "Maggie's paper finally appears in its final form: Maggie Wiśniewska, Caitlin E O’Connell-Rodwell, J Werner Kilian, Simon Garnier, Gareth J Russell, Interplay of physical and social drivers of movement in male African savanna elephants, Behavioral Ecology, Volume 36, Issue 1, January/February 2025, arae091, [https://doi.org/10.1093/beheco/arae091](https://doi.org/10.1093/beheco/arae091)"
  
- date: 28 August, 2024
  headline:  "This is a collaboration with Benjamin Thomas of NJIT’s Department of Physics. Ben’s lab has developed a cool IR laser device — the eBOSS — for non-destructive detection and identification of flying insects. In this case it was used to count mosquitoes in an urban area of NJ, and these counts are compared to traditional methods. I helped with the power analysis. Going forward we plan to see if the eBOSS can sample pollinator communities to a useful taxonomic resolution. [https://www.mdpi.com/2075-4450/15/8/584](https://www.mdpi.com/2075-4450/15/8/584)"
  
  
