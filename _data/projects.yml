- name: Deer stress from camera trap videos
  desc: Review camera trap footage of white-tailed deer, scoring the deer for health based on a rubric. It is part of a project to asses the the stresses associated with living on islands rather than the mainland.
  suitability: Suitable for undergraduates from almost any major. Could be an Independent Study.
  experience: None required. You will be trained on how to assess the deer.

- name: Using AI image generation to preview natural landscaping
  desc: The idea is to take images of traditional urban plantings, such as those around campus, and use AI tools to re-render them with natural plants. These may be used in a future survey
  suitability: Suitable for undergraduates from CS or a related field, or anyone who has experience with AI image generation.
  experience: This project requires an existing background in AI image tools, or at least a willingness to learn.
